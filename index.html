<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nemesis Ultimate Roguelike</title>
  <meta name="theme-color" content="#111827">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="gameContainer"></div>
  <div id="updateBanner" class="update-banner" hidden>
    <span>New version available.</span>
    <div class="update-banner-actions">
      <button id="updateNowBtn" class="btn-pause-action">UPDATE NOW</button>
      <button id="refreshNowBtn" class="btn-pause-action">FORCE REFRESH</button>
    </div>
  </div>
  
  <!-- Core Systems -->
  <script src="config.js"></script>
  <script src="JS/core.js"></script>
  <script src="JS/animations.js?v=20260528a"></script>
  
  <!-- Game Systems -->
  <script src="JS/player.js"></script>
  <script src="JS/tasks.js"></script>
  <script src="JS/enemy.js"></script>
  <script src="JS/stage.js"></script>
  <script src="JS/combat.js"></script>
  
  <!-- UI Systems -->
  <script src="JS/sound.js"></script>
  <script src="JS/shop.js"></script>
  <script src="JS/ui.js?v=20260528a"></script>
  <script src="JS/popups.js"></script>
  
  <!-- Game Initialization -->
  <script>
    const updateBanner = document.getElementById('updateBanner');
    const updateNowBtn = document.getElementById('updateNowBtn');
    const refreshNowBtn = document.getElementById('refreshNowBtn');

    const showUpdateBanner = () => {
      if (updateBanner) updateBanner.hidden = false;
    };

    const hideUpdateBanner = () => {
      if (updateBanner) updateBanner.hidden = true;
    };

    window.forceRefreshNemesisApp = async () => {
      try {
        const registrations = await navigator.serviceWorker?.getRegistrations?.();
        if (Array.isArray(registrations)) {
          await Promise.all(registrations.map((registration) => registration.unregister()));
        }
      } catch (error) {
        console.warn('Service worker unregister failed', error);
      }

      try {
        const cacheKeys = await caches.keys();
        await Promise.all(cacheKeys.map((key) => caches.delete(key)));
      } catch (error) {
        console.warn('Cache clear failed', error);
      }

      const nextUrl = new URL(window.location.href);
      nextUrl.searchParams.set('forceRefresh', Date.now().toString());
      window.location.replace(nextUrl.toString());
    };

    if (updateNowBtn) {
      updateNowBtn.addEventListener('click', async () => {
        try {
          const registration = await navigator.serviceWorker?.getRegistration?.();
          if (registration?.waiting) {
            const reloadOnControllerChange = () => {
              navigator.serviceWorker.removeEventListener('controllerchange', reloadOnControllerChange);
              window.location.reload();
            };
            navigator.serviceWorker.addEventListener('controllerchange', reloadOnControllerChange);
            registration.waiting.postMessage({ type: 'SKIP_WAITING' });
            hideUpdateBanner();
            return;
          }
        } catch (error) {
          console.warn('Update handoff failed', error);
        }
        window.forceRefreshNemesisApp();
      });
    }

    if (refreshNowBtn) {
      refreshNowBtn.addEventListener('click', () => {
        window.forceRefreshNemesisApp();
      });
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        hideUpdateBanner();
      });
    }

    // Initialize on page load
    document.addEventListener('DOMContentLoaded', () => {
      // Create game state
      const state = initializeGameState();
      
      // Try to load saved game
      if (state.load()) {
        console.log('Game loaded from save');
        if (state.dailiesState.dailies.length === 0) {
          TaskManager.ensureStarterTasks();
        }
        if (state.playerState.className) {
          if ((state.stageState.enemies || []).length === 0) {
            StageManager.initializeRun(state.stageState.stage || 1);
          } else {
            StageManager.rehydrateLoadedEnemies();
          }
          UIManager.initializeUI();
          UIManager.refreshGameUI();
        } else {
          PopupsManager.showClassSelection();
        }
      } else {
        console.log('Starting new game');
        // Show class selection
        PopupsManager.showClassSelection();
      }
    });
    
    // Autosave periodically
    setInterval(() => {
      const state = getGameState();
      if (state.playerState.className) {
        state.save();
      }
    }, 30000); // Every 30 seconds
    
    // Check for missed check-in (skipped day death)
    setInterval(() => {
      const state = getGameState();
      
      if (!state.systemState.isPaused && state.playerState.className) {
        const now = new Date();
        const lastCheckIn = state.systemState.lastCheckInTime 
          ? new Date(state.systemState.lastCheckInTime)
          : new Date();
        
        // Check if a full calendar day has passed
        const daysElapsed = (now - lastCheckIn) / (1000 * 60 * 60 * 24);
        
        if (daysElapsed > 1) {
          // Missed check-in - instant permadeath
          state.eventBus.emit(EVENTS.SKIPPED_DAY_DEATH);
          
          PopupsManager.showDeathScreen({
            class: state.playerState.className,
            stage: state.stageState.stage,
            level: state.playerState.level,
            enemiesDefeated: state.systemState.runStats.enemiesDefeated,
            bossesSailed: state.systemState.runStats.bossesSailed,
            goldEarned: state.systemState.runStats.totalGoldEarned
          });
        }
      }
    }, 60000); // Check every minute

    // Register the service worker when hosted over HTTP(S)
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').then((registration) => {
          const maybeShow = () => {
            if (registration.waiting) {
              showUpdateBanner();
            }
          };

          if (registration.waiting) {
            showUpdateBanner();
          }

          registration.addEventListener('updatefound', () => {
            const newWorker = registration.installing;
            if (!newWorker) return;
            newWorker.addEventListener('statechange', () => {
              if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                showUpdateBanner();
              }
            });
          });

          maybeShow();
        }).catch((error) => {
          console.warn('Service worker registration failed', error);
        });
      });
    }
  </script>
</body>
</html>
