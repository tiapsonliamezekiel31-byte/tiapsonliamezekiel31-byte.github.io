<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nemesis Ultimate Roguelike</title>
  <meta name="theme-color" content="#111827">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css?v=20260606c">
</head>
<body>
  <div id="gameContainer"></div>
  <div id="updateBanner" class="update-banner" hidden>
    <span>New version available.</span>
    <div class="update-banner-actions">
      <button id="updateNowBtn" class="btn-pause-action">UPDATE NOW</button>
      <button id="refreshNowBtn" class="btn-pause-action">FORCE REFRESH</button>
    </div>
  </div>
  
  <!-- Core Systems -->
  <script src="config.js"></script>
  <script src="JS/core.js"></script>
  <script src="JS/animations.js?v=20260606b"></script>
  
  <!-- Game Systems -->
  <script src="JS/player.js"></script>
  <script src="JS/tasks.js"></script>
  <script src="JS/enemy.js"></script>
  <script src="JS/stage.js"></script>
  <script src="JS/combat.js?v=20260606b"></script>
  
  <!-- UI Systems -->
  <script src="JS/sound.js"></script>
  <script src="JS/shop.js"></script>
  <script src="JS/ui.js?v=20260606c"></script>
  <script src="JS/popups.js?v=20260606c"></script>
  
  <!-- Game Initialization -->
  <script>
    const updateBanner = document.getElementById('updateBanner');
    const updateNowBtn = document.getElementById('updateNowBtn');
    const refreshNowBtn = document.getElementById('refreshNowBtn');

    const showUpdateBanner = () => {
      if (updateBanner) updateBanner.hidden = false;
    };

    const hideUpdateBanner = () => {
      if (updateBanner) updateBanner.hidden = true;
    };

    window.forceRefreshNemesisApp = async () => {
      try {
        const registrations = await navigator.serviceWorker?.getRegistrations?.();
        if (Array.isArray(registrations)) {
          await Promise.all(registrations.map((registration) => registration.unregister()));
        }
      } catch (error) {
        console.warn('Service worker unregister failed', error);
      }

      try {
        const cacheKeys = await caches.keys();
        await Promise.all(cacheKeys.map((key) => caches.delete(key)));
      } catch (error) {
        console.warn('Cache clear failed', error);
      }

      const nextUrl = new URL(window.location.href);
      nextUrl.searchParams.set('forceRefresh', Date.now().toString());
      window.location.replace(nextUrl.toString());
    };

    if (updateNowBtn) {
      updateNowBtn.addEventListener('click', async () => {
        try {
          const registration = await navigator.serviceWorker?.getRegistration?.();
          if (registration?.waiting) {
            const reloadOnControllerChange = () => {
              navigator.serviceWorker.removeEventListener('controllerchange', reloadOnControllerChange);
              window.location.reload();
            };
            navigator.serviceWorker.addEventListener('controllerchange', reloadOnControllerChange);
            try {
              registration.waiting.postMessage({ type: 'SKIP_WAITING' });
            } catch (err) {
              console.warn('postMessage to waiting worker failed', err);
            }
            // If the worker doesn't activate within a short time, fall back to a force refresh
            setTimeout(() => {
              if (navigator.serviceWorker.controller) return; // already changed
              console.log('Update handoff timeout, forcing refresh');
              window.forceRefreshNemesisApp();
            }, 2500);
            hideUpdateBanner();
            return;
          }
        } catch (error) {
          console.warn('Update handoff failed', error);
        }
        window.forceRefreshNemesisApp();
      });
    }

    if (refreshNowBtn) {
      refreshNowBtn.addEventListener('click', () => {
        window.forceRefreshNemesisApp();
      });
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        hideUpdateBanner();
      });
    }

    // Give users a quick fallback: clicking the banner background forces refresh,
    // and provide a small dismiss button in case they want to continue without updating.
    if (updateBanner) {
      updateBanner.addEventListener('click', (e) => {
        if (e.target === updateBanner) {
          // Clicked the banner background — force refresh
          try { window.forceRefreshNemesisApp(); } catch (err) { location.reload(); }
        }
      });

      const dismissBtn = document.createElement('button');
      dismissBtn.className = 'btn-pause-action diamond-rewards-btn';
      dismissBtn.style.marginLeft = '8px';
      dismissBtn.textContent = 'DISMISS';
      dismissBtn.addEventListener('click', (ev) => { ev.stopPropagation(); hideUpdateBanner(); });
      const actions = updateBanner.querySelector('.update-banner-actions');
      if (actions) actions.appendChild(dismissBtn);
    }

    // Initialize on page load
    document.addEventListener('DOMContentLoaded', () => {
      // Create game state
      const state = initializeGameState();
      
      // Try to load saved game
      if (state.load()) {
        console.log('Game loaded from save');
        if (state.dailiesState.dailies.length === 0) {
          TaskManager.ensureStarterTasks();
        }
        if (state.playerState.className) {
          if ((state.stageState.enemies || []).length === 0) {
            StageManager.initializeRun(state.stageState.stage || 1);
          } else {
            StageManager.rehydrateLoadedEnemies();
          }
          UIManager.initializeUI();
          UIManager.refreshGameUI();
        } else {
          PopupsManager.showClassSelection();
        }
      } else {
        console.log('Starting new game');
        // Show class selection
        PopupsManager.showClassSelection();
      }
    });
    
    // Autosave periodically
    setInterval(() => {
      const state = getGameState();
      if (state.playerState.className) {
        state.save();
      }
    }, 30000); // Every 30 seconds
    
    // Missed check-in auto-kill has been removed. Check-ins are now fully handled in-game.

    // Register the service worker when hosted over HTTP(S)
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').then((registration) => {
          const maybeShow = () => {
            if (registration.waiting) {
              showUpdateBanner();
            }
          };

          if (registration.waiting) {
            showUpdateBanner();
          }

          registration.addEventListener('updatefound', () => {
            const newWorker = registration.installing;
            if (!newWorker) return;
            newWorker.addEventListener('statechange', () => {
              if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                showUpdateBanner();
              }
            });
          });

          maybeShow();
        }).catch((error) => {
          console.warn('Service worker registration failed', error);
        });
      });
    }
  </script>
  <script>
    // Runtime UI debug helpers: log clicks and surface JS errors/promises
    (function(){
      window.addEventListener('error', (e) => {
        console.error('Runtime error caught by debug helper:', e.message, e.filename, e.lineno, e.colno, e.error);
        const marker = document.getElementById('runtimeErrorMarker') || document.createElement('div');
        marker.id = 'runtimeErrorMarker';
        marker.style.position = 'fixed';
        marker.style.right = '12px';
        marker.style.bottom = '12px';
        marker.style.padding = '8px 10px';
        marker.style.background = 'rgba(200,40,40,0.95)';
        marker.style.color = 'white';
        marker.style.zIndex = 6000;
        marker.style.fontSize = '12px';
        marker.style.fontFamily = 'sans-serif';
        marker.textContent = 'JS Error: ' + (e.message || 'see console');
        document.body.appendChild(marker);
      });

      window.addEventListener('unhandledrejection', (ev) => {
        console.error('Unhandled promise rejection:', ev.reason);
      });

      document.addEventListener('click', (ev) => {
        try {
          console.log('DEBUG CLICK:', ev.target && (ev.target.id || ev.target.className || ev.target.tagName));
        } catch (err) { /* ignore */ }
      }, { capture: true });

      // Ensure update banner buttons allow pointer events and log their clicks
      const ub = document.getElementById('updateBanner');
      if (ub) ub.style.pointerEvents = 'auto';
      ['updateNowBtn','refreshNowBtn'].forEach((id) => {
        const el = document.getElementById(id);
        if (!el) return;
        el.setAttribute('type','button');
        el.style.pointerEvents = 'auto';
        el.addEventListener('click', (e) => {
          console.log('DEBUG BUTTON CLICK:', id);
        }, { capture: true });
      });
    })();
  </script>
</body>
</html>
