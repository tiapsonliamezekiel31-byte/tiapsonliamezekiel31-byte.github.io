<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nemesis Planner</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #f5f5f7;
      background: #0b0c10;
      color-scheme: dark;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    :root {
      --planner-bar-height: 60px;
      --planner-surface: rgba(18, 20, 28, 0.82);
      --planner-surface-strong: rgba(22, 24, 33, 0.94);
      --planner-border: rgba(255, 255, 255, 0.08);
      --planner-border-strong: rgba(255, 255, 255, 0.16);
      --planner-shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
      --planner-shadow-soft: 0 8px 24px rgba(0, 0, 0, 0.22);
    }

    .planner-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background:
        radial-gradient(circle at top, rgba(34, 36, 48, 0.95), rgba(11, 12, 16, 0.94) 52%, rgba(7, 8, 12, 0.98) 100%);
      display: flex;
      flex-direction: column;
      padding-top: var(--planner-bar-height);
      overflow: hidden;
    }

    .planner-header {
      background: rgba(16, 18, 26, 0.78);
      border-bottom: 1px solid var(--planner-border);
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .planner-stage {
      position: relative;
      flex: 1;
      padding: 12px;
      display: block;
      overflow-y: auto;
      min-height: 0;
      overscroll-behavior: contain;
      background:
        radial-gradient(circle at top, rgba(255, 255, 255, 0.05), transparent 42%),
        linear-gradient(180deg, #090b10 0%, #0d1018 44%, #06070b 100%);
      isolation: isolate;
    }

    .planner-stage-background {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    .planner-bg-none {
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.02));
    }

    .planner-bg-grid {
      background-color: transparent;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.18) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.18) 1px, transparent 1px);
      background-size: 24px 24px;
      background-position: -1px -1px;
      mix-blend-mode: normal;
    }

    .planner-bg-lines {
      background: transparent;
      opacity: 1;
    }

    .planner-stage-bar-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      opacity: 0.55;
    }

    .planner-stage-bar {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 3px;
      background: rgba(255, 255, 255, 0.18);
      box-shadow: 0 0 6px rgba(255, 255, 255, 0.08);
      transform: translateX(-50%);
    }

    .planner-stage-content {
      position: relative;
      z-index: 1;
      min-height: 100%;
      width: 100%;
    }

    .planner-task {
      background: rgba(22, 24, 33, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 18px;
      padding: 12px 14px;
      cursor: grab;
      transition: transform 0.16s ease, box-shadow 0.16s ease, border-color 0.16s ease;
      position: relative;
      touch-action: manipulation;
      min-height: 72px;
      white-space: pre-line;
      line-height: 1.5;
      box-shadow: var(--planner-shadow-soft);
      color: #1c1c1e;
    }

    .planner-task:hover {
      border-color: rgba(10, 132, 255, 0.42);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.34);
      transform: translateY(-1px);
    }

    .planner-task.completed {
      opacity: 0.5;
      text-decoration: line-through;
    }

    .planner-reward-bar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      min-height: var(--planner-bar-height);
      background: rgba(14, 16, 22, 0.94);
      backdrop-filter: blur(18px) saturate(160%);
      -webkit-backdrop-filter: blur(18px) saturate(160%);
      border-bottom: 1px solid var(--planner-border);
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 8px;
      z-index: 100;
      gap: 8px;
      flex-wrap: wrap;
    }

    .reward-display {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: #f5f5f7;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 999px;
      padding: 8px 12px;
      box-shadow: var(--planner-shadow-soft);
    }

    .planner-reward-bar .btn-icon,
    .planner-modal .btn-icon,
    #addNoteBtn {
      background: rgba(20, 22, 30, 0.96);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #f5f5f7;
      border-radius: 999px;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
      box-shadow: var(--planner-shadow-soft);
    }

    .planner-reward-bar .btn-icon:hover,
    .planner-modal .btn-icon:hover,
    #addNoteBtn:hover {
      background: rgba(34, 37, 48, 0.98);
      border-color: rgba(10, 132, 255, 0.4);
      color: #7eb8ff;
      transform: translateY(-1px);
    }

    .date-info {
      color: #f5f5f7 !important;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .sticky-note {
      position: fixed;
      background: rgba(20, 22, 30, 0.96);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 10px;
      box-shadow: var(--planner-shadow-soft);
      border-radius: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
      font-size: 12px;
      color: #f5f5f7;
      cursor: grab;
      z-index: 50;
    }

    .sticky-note.dragging {
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.36);
    }

    .note-toolbar {
      display: flex;
      gap: 4px;
      margin-bottom: 4px;
      padding: 4px;
      border-bottom: 1px solid rgba(60, 60, 67, 0.12);
    }

    .note-btn {
      background: #14161d;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      cursor: pointer;
      padding: 2px 4px;
      font-size: 10px;
      color: #f5f5f7;
    }

    .shape-task {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: 10px;
      line-height: 1.35;
      color: #ffffff;
      padding: 8px;
      user-select: none;
      cursor: grab;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.16);
      border: 1px solid rgba(255, 255, 255, 0.18);
      min-width: 72px;
      min-height: 72px;
      max-width: 150px;
      max-height: 150px;
      white-space: pre-line;
      touch-action: none;
    }

    .shape-task.completed-pulse {
      animation: planner-pop 180ms ease-out forwards;
    }

    .shape-easy {
      background: linear-gradient(180deg, #4f8ef7, #2a63e8);
      border-radius: 50%;
    }

    .shape-medium {
      background: linear-gradient(180deg, #f7d65e, #e7b90a);
      clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
      color: #14161d;
    }

    .shape-hard {
      background: linear-gradient(180deg, #ff6b6b, #e84a4d);
      border-radius: 4px;
    }

    .shape-ultra {
      background: linear-gradient(180deg, #a855f7, #6d28d9);
      clip-path: polygon(30% 0%, 70% 0%, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0% 70%, 0% 30%);
    }

    @keyframes planner-pop {
      0% { transform: scale(1); opacity: 1; }
      100% { transform: scale(1.18); opacity: 0; }
    }

    .planner-modal {
      position: fixed;
      inset: 0;
      z-index: 500;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 12px;
      background: rgba(0, 0, 0, 0.58);
      backdrop-filter: blur(20px) saturate(130%);
      -webkit-backdrop-filter: blur(20px) saturate(130%);
    }

    .planner-modal.open {
      display: flex;
    }

    .planner-modal-card {
      width: min(920px, 100%);
      max-height: min(90vh, 920px);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background: rgba(18, 20, 28, 0.96);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 28px;
      box-shadow: var(--planner-shadow);
    }

    .planner-modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 18px;
      border-bottom: 1px solid var(--planner-border);
      background: rgba(255, 255, 255, 0.04);
    }

    .planner-modal-header h2 {
      font-size: 16px;
      font-weight: 700;
      color: #f5f5f7;
    }

    .planner-modal-body {
      display: grid;
      grid-template-columns: minmax(300px, 380px) 1fr;
      gap: 12px;
      padding: 16px;
      overflow: auto;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.04), rgba(255, 255, 255, 0.02));
    }

    .planner-summary {
      display: grid;
      gap: 10px;
      margin-bottom: 10px;
    }

    .planner-summary-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 18px;
      padding: 12px 14px;
      font-size: 12px;
      line-height: 1.45;
      box-shadow: var(--planner-shadow-soft);
    }

    .planner-summary-card strong {
      color: #f5f5f7;
    }

    .planner-summary-pill {
      padding: 4px 8px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(255, 255, 255, 0.06);
      border-radius: 999px;
      white-space: nowrap;
    }

    .planner-summary-pill.is-hot {
      color: #6fb1ff;
      border-color: rgba(10, 132, 255, 0.26);
      box-shadow: 0 0 0 1px rgba(10, 132, 255, 0.12) inset;
    }

    .planner-summary-pill.is-muted {
      color: #a1a1aa;
    }

    .planner-panel {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      padding: 14px;
      min-width: 0;
      box-shadow: var(--planner-shadow-soft);
    }

    .planner-panel h3 {
      font-size: 12px;
      font-weight: 700;
      color: #f5f5f7;
      margin-bottom: 12px;
      letter-spacing: 0.01em;
    }

    .planner-section-label {
      font-size: 11px;
      color: #6e6e73;
      margin: 10px 0 6px;
      text-transform: none;
      letter-spacing: 0;
    }

    .planner-field,
    .planner-select,
    .planner-textarea,
    .planner-input {
      width: 100%;
      background: rgba(8, 10, 16, 0.96);
      color: #f5f5f7;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      padding: 10px 12px;
      font-family: inherit;
      font-size: 13px;
      outline: none;
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.05) inset;
    }

    .planner-field:focus-within,
    .planner-select:focus,
    .planner-textarea:focus,
    .planner-input:focus {
      border-color: rgba(10, 132, 255, 0.52);
      box-shadow: 0 0 0 4px rgba(10, 132, 255, 0.16);
    }

    .planner-textarea {
      min-height: 180px;
      resize: vertical;
      line-height: 1.45;
    }

    .planner-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 8px;
    }

    .planner-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }

    .planner-task-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 250px;
      overflow: auto;
      margin-top: 10px;
    }

    .planner-task-list.has-scroll {
      padding-right: 4px;
    }

    .planner-task-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 10px 12px;
      font-size: 12px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.06);
    }

    .planner-task-meta {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }

    .planner-task-meta strong {
      color: #f5f5f7;
    }

    .planner-error {
      margin-top: 8px;
      color: #ff7b7b;
      font-size: 12px;
      line-height: 1.5;
      min-height: 16px;
      white-space: pre-line;
    }

    .planner-empty {
      font-size: 12px;
      color: #a1a1aa;
      line-height: 1.5;
    }

    .planner-subtle {
      font-size: 11px;
      color: #a1a1aa;
      line-height: 1.45;
    }

    .planner-toggle-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }

    .planner-toggle-row .btn-icon.is-active {
      border-color: rgba(10, 132, 255, 0.4);
      box-shadow: 0 0 0 4px rgba(10, 132, 255, 0.18);
      color: #7eb8ff;
    }

    .planner-inline-note {
      font-size: 11px;
      color: #a1a1aa;
      line-height: 1.4;
      margin-top: 6px;
    }

    @media (max-width: 760px) {
      .planner-modal-body {
        grid-template-columns: 1fr;
      }

      .planner-modal-card {
        max-height: 94vh;
      }

      .planner-row {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 768px) {
      :root {
        --planner-bar-height: 96px;
      }

      .planner-container {
        padding-top: var(--planner-bar-height);
      }

      .planner-reward-bar {
        justify-content: center;
        align-items: stretch;
        padding: 8px 10px;
      }

      .reward-display,
      .date-info,
      .planner-reward-bar .btn-icon {
        flex: 1 1 44%;
      }

      .planner-reward-bar .btn-icon,
      .planner-modal .btn-icon,
      #addNoteBtn {
        background: rgba(20, 22, 30, 0.96);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: #f5f5f7;
        border-radius: 999px;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
        box-shadow: var(--planner-shadow-soft);
      }

      .planner-reward-bar .btn-icon:hover,
      .planner-modal .btn-icon:hover,
      #addNoteBtn:hover {
        background: rgba(34, 37, 48, 0.98);
        border-color: rgba(10, 132, 255, 0.4);
        color: #7eb8ff;
        transform: translateY(-1px);
      }
      .date-info {
        justify-content: center;
        text-align: center;
      }

      .planner-reward-bar .btn-icon {
        font-size: 12px;
        padding: 10px 12px;
        white-space: normal;
      }

      .planner-stage {
        padding: 10px;
        gap: 10px;
        grid-template-columns: 1fr;
      }

      .planner-task {
        min-height: 84px;
        padding: 10px;
      }

      #addNoteBtn {
        right: 12px !important;
        bottom: 12px !important;
        font-size: 10px;
        padding: 8px 10px;
        max-width: min(45vw, 160px);
      }
    }

    @media (max-width: 480px) {
      :root {
        --planner-bar-height: 132px;
      }

      .planner-reward-bar {
        gap: 6px;
      }

      .reward-display,
      .date-info,
      .planner-reward-bar .btn-icon {
        flex: 1 1 100%;
      }

      .planner-reward-bar .btn-icon {
        width: 100%;
      }

      .planner-stage {
        padding: 8px;
      }

      .planner-task {
        min-height: 92px;
      }

      .sticky-note {
        max-width: calc(100vw - 24px);
      }
    }

    @media (pointer: coarse) {
      .planner-task,
      .btn-icon,
      .note-btn,
      #addNoteBtn {
        touch-action: manipulation;
      }

      .sticky-note {
        max-width: calc(100vw - 24px);
      }
    }
  </style>
</head>
<body>
  <div class="planner-container">
    <div class="planner-reward-bar">
      <div class="reward-display">
        💎 <span id="pendingDiamonds">0</span> Diamonds
      </div>
      <div class="reward-display">
        💰 <span id="pendingGold">0</span> Gold
      </div>
      <div class="date-info" style="color: var(--text-white);">
        <span id="plannerDate">Today</span>
      </div>
      <button id="homeBtn" class="btn-icon">🏠 Back</button>
      <button id="resetBtn" class="btn-icon">↺ Reset</button>
      <button id="calendarBtn" class="btn-icon">📅 Config</button>
      <button id="logsBtn" class="btn-icon">📜 Logs</button>
    </div>

    <div class="planner-stage" id="plannerStage"></div>

    <!-- Floating button for notes -->
    <button id="addNoteBtn" class="btn-icon" style="position: fixed; bottom: 20px; right: 20px;">📝 Add Note</button>
  </div>

  <div class="planner-modal" id="configModal" aria-hidden="true">
    <div class="planner-modal-card" role="dialog" aria-modal="true" aria-labelledby="plannerConfigTitle">
      <div class="planner-modal-header">
        <h2 id="plannerConfigTitle">Planner Config</h2>
        <button id="closeConfigBtn" class="btn-icon">✕ Close</button>
      </div>
      <div class="planner-modal-body">
        <div class="planner-panel">
          <h3>Date + Add Task</h3>
          <div class="planner-summary">
            <div class="planner-summary-card">
              <div>
                <strong id="activeDateLabel">Active date</strong>
                <div id="activeDateDetail" class="planner-subtle">Choose a date to see its tasks and background.</div>
              </div>
              <div id="activeDateCount" class="planner-summary-pill is-muted">0 tasks</div>
            </div>
            <div class="planner-summary-card">
              <div>
                <strong>Background preset</strong>
                <div class="planner-subtle">Controls the stage look for this date.</div>
              </div>
              <div id="backgroundPreviewLabel" class="planner-summary-pill is-muted">none</div>
            </div>
          </div>
          <div class="planner-row">
            <label class="planner-field">
              <div class="planner-inline-note">Date</div>
              <input id="configDateInput" class="planner-input" type="date">
            </label>
            <label class="planner-field">
              <div class="planner-inline-note">Attribute</div>
              <select id="configAttributeInput" class="planner-select">
                <option value="STR">STR</option>
                <option value="INT">INT</option>
                <option value="DISC">DISC</option>
                <option value="CREA">CREA</option>
                <option value="SOC">SOC</option>
                <option value="CAP">CAP</option>
                <option value="RESP">RESP</option>
              </select>
            </label>
          </div>
          <div class="planner-section-label">Date tools</div>
          <div class="planner-toggle-row">
            <button id="confirmDateBtn" class="btn-icon">✓ Confirm Date</button>
          </div>
          <div class="planner-row" style="margin-top: 8px;">
            <label class="planner-field">
              <div class="planner-inline-note">Stage background</div>
              <select id="backgroundPresetInput" class="planner-select">
                <option value="none">None</option>
                <option value="grid">Thin Grid</option>
                <option value="lines">Vertical Bars</option>
              </select>
            </label>
            <label class="planner-field">
              <div class="planner-inline-note">Bar count</div>
              <input id="backgroundBarCountInput" class="planner-input" type="number" min="2" max="20" step="1" value="8">
            </label>
          </div>
          <label class="planner-field">
            <div class="planner-inline-note">Task name</div>
            <input id="configTaskNameInput" class="planner-input" type="text" placeholder="Work out">
          </label>
          <div class="planner-row" style="margin-top: 8px;">
            <label class="planner-field">
              <div class="planner-inline-note">Difficulty</div>
              <select id="configDifficultyInput" class="planner-select">
                <option value="Easy">Easy</option>
                <option value="Medium">Medium</option>
                <option value="Hard">Hard</option>
                <option value="Ultra">Ultra</option>
              </select>
            </label>
            <label class="planner-field">
              <div class="planner-inline-note">Quick add format</div>
              <div class="planner-empty">DD/MM/YYYY\nE - STR - task name;</div>
            </label>
          </div>
          <div class="planner-actions">
            <button id="addTaskBtn" class="btn-icon">Add Task</button>
            <button id="saveDateBtn" class="btn-icon">Use Date</button>
          </div>
          <div class="planner-section-label">Move tasks to another day</div>
          <div class="planner-row">
            <label class="planner-field">
              <div class="planner-inline-note">Destination date</div>
              <input id="moveToDateInput" class="planner-input" type="date">
            </label>
            <label class="planner-field">
              <div class="planner-inline-note">Move mode</div>
              <select id="moveModeInput" class="planner-select">
                <option value="all">All tasks</option>
                <option value="incomplete">Only incomplete</option>
                <option value="completed">Only completed</option>
              </select>
            </label>
          </div>
          <div class="planner-actions">
            <button id="moveTasksBtn" class="btn-icon">Move Tasks</button>
          </div>
          <div class="planner-error" id="configError"></div>
        </div>

        <div class="planner-panel">
          <h3>Quick Add + Tasks</h3>
          <label class="planner-field">
            <div class="planner-inline-note">Batch input</div>
            <textarea id="quickAddInput" class="planner-textarea" placeholder="20/5/2026\nM - STR - work out;\nE - INT - read book;\n\n21/5/2026\nU - RESP - buy groceries;"></textarea>
          </label>
          <div class="planner-actions">
            <button id="quickAddBtn" class="btn-icon">Quick Add Batch</button>
          </div>
          <div class="planner-task-list" id="configTaskList"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="planner-modal" id="logsModal" aria-hidden="true">
    <div class="planner-modal-card" role="dialog" aria-modal="true" aria-labelledby="plannerLogsTitle">
      <div class="planner-modal-header">
        <h2 id="plannerLogsTitle">Planner Logs</h2>
        <button id="closeLogsBtn" class="btn-icon">✕ Close</button>
      </div>
      <div class="planner-modal-body" style="grid-template-columns: 1fr;">
        <div class="planner-panel">
          <h3>Editable quick-add format</h3>
          <label class="planner-field">
            <div class="planner-inline-note">Log text (stored locally)</div>
            <textarea id="plannerLogsInput" class="planner-textarea" placeholder="20/5/2026\nM - STR - work out;\nE - INT - read book;"></textarea>
          </label>
          <div class="planner-actions">
            <button id="refreshLogsBtn" class="btn-icon">Refresh from tasks</button>
            <button id="saveLogsBtn" class="btn-icon">Save Logs</button>
            <button id="applyLogsBtn" class="btn-icon">Apply Logs to Tasks</button>
          </div>
          <div class="planner-error" id="logsError"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="config.js"></script>
  <script src="JS/core.js"></script>
  <script src="JS/animations.js"></script>
  <script>
    // Planner app state
    const plannerKey = 'nemesis_planner_data';
    const plannerDifficultyOrder = ['Easy', 'Medium', 'Hard', 'Ultra'];
    const plannerAttributeOptions = ['STR', 'INT', 'DISC', 'CREA', 'SOC', 'CAP', 'RESP'];

    class PlannerApp {
      constructor() {
        this.data = this.loadData();
        this.currentDate = new Date().toISOString().split('T')[0];
        this.activeConfigDate = this.currentDate;
        this.dragState = null;
        this.initializeUI();
      }

      loadData() {
        const saved = localStorage.getItem(plannerKey);
        if (!saved) return { _meta: { logsRaw: '' } };
        try {
          const parsed = JSON.parse(saved);
          if (!parsed._meta) parsed._meta = { logsRaw: '' };
          if (typeof parsed._meta.logsRaw !== 'string') parsed._meta.logsRaw = '';
          return parsed;
        } catch (e) {
          return { _meta: { logsRaw: '' } };
        }
      }

      saveData() {
        localStorage.setItem(plannerKey, JSON.stringify(this.data));
        // Trigger storage event for cross-tab sync
        window.dispatchEvent(new StorageEvent('storage', {
          key: plannerKey,
          newValue: JSON.stringify(this.data)
        }));
      }

      initializeUI() {
        document.getElementById('homeBtn').addEventListener('click', () => {
          window.location.href = 'index.html';
        });

        document.getElementById('resetBtn').addEventListener('click', () => {
          this.resetTodayRewards();
        });

        document.getElementById('calendarBtn').addEventListener('click', () => {
          this.showConfigPopup();
        });

        document.getElementById('logsBtn').addEventListener('click', () => {
          this.openLogsPopup();
        });

        document.getElementById('closeConfigBtn').addEventListener('click', () => {
          this.closeConfigPopup();
        });

        document.getElementById('configDateInput').addEventListener('change', (event) => {
          const nextDate = this.normalizeDateInput(event.target.value, true);
          if (!nextDate) return;
          this.applyDateSelection(nextDate, { requireConfirm: true });
        });

        document.getElementById('saveDateBtn').addEventListener('click', () => {
          const rawDate = document.getElementById('configDateInput').value;
          if (!this.applyDateSelection(rawDate, { requireConfirm: true })) {
            this.setConfigError('Choose a valid date first.');
            return;
          }
        });

        document.getElementById('confirmDateBtn').addEventListener('click', () => {
          const rawDate = document.getElementById('configDateInput').value;
          if (!this.applyDateSelection(rawDate, { requireConfirm: true })) {
            this.setConfigError('Choose a valid date first.');
          }
        });

        document.getElementById('backgroundPresetInput').addEventListener('change', (event) => {
          this.applyBackgroundPreset(event.target.value);
        });

        document.getElementById('backgroundBarCountInput').addEventListener('change', (event) => {
          this.applyBackgroundBarCount(event.target.value);
        });

        document.getElementById('addTaskBtn').addEventListener('click', () => {
          this.addTaskFromForm();
        });

        document.getElementById('moveTasksBtn').addEventListener('click', () => {
          const toDate = document.getElementById('moveToDateInput').value;
          const mode = document.getElementById('moveModeInput').value;
          this.moveTasksToDate(this.activeConfigDate || this.currentDate, toDate, mode);
        });

        document.getElementById('quickAddBtn').addEventListener('click', () => {
          this.applyQuickAdd();
        });

        document.getElementById('addNoteBtn').addEventListener('click', () => {
          this.addNote();
        });

        document.getElementById('configModal').addEventListener('click', (event) => {
          if (event.target.id === 'configModal') {
            this.closeConfigPopup();
          }
        });

        document.getElementById('closeLogsBtn').addEventListener('click', () => {
          this.closeLogsPopup();
        });

        document.getElementById('refreshLogsBtn').addEventListener('click', () => {
          this.refreshLogsFromTasks();
        });

        document.getElementById('saveLogsBtn').addEventListener('click', () => {
          this.saveLogsText();
        });

        document.getElementById('applyLogsBtn').addEventListener('click', () => {
          this.applyLogsToTasks();
        });

        document.getElementById('logsModal').addEventListener('click', (event) => {
          if (event.target.id === 'logsModal') {
            this.closeLogsPopup();
          }
        });

        this.updateDisplay();
        this.renderTasks();
        this.syncConfigInputs();
        this.syncConfigState();
      }

      updateDisplay() {
        const today = this.getDayData(this.currentDate);
        document.getElementById('pendingDiamonds').textContent = today.pendingRewards?.diamonds || 0;
        document.getElementById('pendingGold').textContent = today.pendingRewards?.gold || 0;

        const [year, month, day] = this.currentDate.split('-').map(Number);
        const dateStr = new Date(year, month - 1, day).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
        document.getElementById('plannerDate').textContent = dateStr;
      }

      renderTasks() {
        const today = this.getDayData(this.currentDate);
        const container = document.getElementById('plannerStage');
        container.innerHTML = '';

        const background = document.createElement('div');
        background.className = `planner-stage-background planner-bg-${today.backgroundPreset || 'none'}`;
        container.appendChild(background);

        if ((today.backgroundPreset || 'none') === 'lines') {
          const barLayer = document.createElement('div');
          barLayer.className = 'planner-stage-bar-layer';
          const barCount = this.getBackgroundBarCount(today);
          for (let index = 0; index < barCount; index++) {
            const bar = document.createElement('div');
            bar.className = 'planner-stage-bar';
            const position = ((index + 1) / (barCount + 1)) * 100;
            bar.style.left = `${position}%`;
            barLayer.appendChild(bar);
          }
          container.appendChild(barLayer);
        }

        const content = document.createElement('div');
        content.className = 'planner-stage-content';
        container.appendChild(content);

        const tasks = (today.tasks || []).filter(task => !task.completed);
        const stageWidth = container.clientWidth || container.getBoundingClientRect().width || 320;
        const stageHeight = container.clientHeight || 400;

        tasks.forEach(task => {
          if (typeof task.x !== 'number' || typeof task.y !== 'number') {
            const seeded = this.seedTaskPosition(task, stageWidth, stageHeight);
            task.x = seeded.x;
            task.y = seeded.y;
            this.saveData();
          }

          const el = document.createElement('div');
          el.className = `shape-task shape-${this.shapeClassForDifficulty(task.difficulty)}`;
          el.style.left = `${Math.max(0, Math.min(task.x, Math.max(stageWidth - 80, 0)))}px`;
          el.style.top = `${Math.max(0, Math.min(task.y, Math.max(stageHeight - 80, 0)))}px`;
          el.dataset.taskId = task.id;
          el.textContent = `${task.name}\n${task.difficulty}\n${task.attribute}`;

          let pointerStart = null;
          el.addEventListener('pointerdown', (event) => {
            event.preventDefault();
            el.setPointerCapture(event.pointerId);
            pointerStart = {
              x: event.clientX,
              y: event.clientY,
              left: task.x,
              top: task.y,
              moved: false,
              pointerId: event.pointerId
            };
            this.dragState = pointerStart;
          });

          el.addEventListener('pointermove', (event) => {
            if (!pointerStart || pointerStart.pointerId !== event.pointerId) return;
            const dx = event.clientX - pointerStart.x;
            const dy = event.clientY - pointerStart.y;
            if (Math.abs(dx) > 4 || Math.abs(dy) > 4) {
              pointerStart.moved = true;
            }
            if (!pointerStart.moved) return;

            const nextX = Math.max(0, Math.min(pointerStart.left + dx, Math.max(stageWidth - 84, 0)));
            const nextY = Math.max(0, Math.min(pointerStart.top + dy, Math.max(stageHeight - 84, 0)));
            el.style.left = `${nextX}px`;
            el.style.top = `${nextY}px`;
            task.x = nextX;
            task.y = nextY;
          });

          el.addEventListener('pointerup', (event) => {
            if (!pointerStart || pointerStart.pointerId !== event.pointerId) return;
            const moved = pointerStart.moved;
            pointerStart = null;
            this.dragState = null;
            if (!moved) {
              this.completeTask(this.currentDate, task.id, el);
              return;
            }
            this.saveData();
          });

          el.addEventListener('pointercancel', () => {
            pointerStart = null;
            this.dragState = null;
            this.saveData();
          });

          content.appendChild(el);
        });

        if (!tasks.length) {
          const empty = document.createElement('div');
          empty.className = 'planner-stage-empty planner-empty';
          empty.textContent = 'No active planner tasks for this date yet. Use the config popup to add one or paste a quick-add batch.';
          content.appendChild(empty);
        }

        this.renderConfigTasks();
        this.syncConfigState();
      }

      completeTask(date, taskId, element) {
        const day = this.getDayData(date);
        const task = day.tasks.find(t => t.id === taskId);
        if (!task) return;

        if (element) {
          element.classList.add('completed-pulse');
          setTimeout(() => element.remove(), 180);
        }

        task.completed = !task.completed;

        if (task.completed) {
          // Award rewards
          const rewardMap = {
            Easy: { diamonds: 1, gold: 0 },
            Medium: { diamonds: 2, gold: 5 },
            Hard: { diamonds: 3, gold: 10 },
            Ultra: { diamonds: 4, gold: 20 }
          };

          const reward = rewardMap[task.difficulty] || { diamonds: 0, gold: 0 };
          day.pendingRewards.diamonds += reward.diamonds;
          day.pendingRewards.gold += reward.gold;
        }

        this.saveData();
        this.updateDisplay();
        this.renderTasks();
      }

      resetTodayRewards() {
        const day = this.getDayData(this.currentDate);

        day.pendingRewards = { diamonds: 0, gold: 0 };
        (day.tasks || []).forEach(t => t.completed = false);

        this.saveData();
        this.updateDisplay();
        this.renderTasks();
      }

      showConfigPopup() {
        this.setConfigError('');
        this.activeConfigDate = this.currentDate;
        this.syncConfigInputs();
        this.renderConfigTasks();
        document.getElementById('configModal').classList.add('open');
        document.getElementById('configModal').setAttribute('aria-hidden', 'false');
        document.getElementById('configDateInput').focus();
      }

      closeConfigPopup() {
        document.getElementById('configModal').classList.remove('open');
        document.getElementById('configModal').setAttribute('aria-hidden', 'true');
      }

      openLogsPopup() {
        this.setLogsError('');
        if (!this.data._meta) this.data._meta = { logsRaw: '' };
        const currentRaw = this.data._meta.logsRaw || this.exportQuickAddFromTasks();
        document.getElementById('plannerLogsInput').value = currentRaw;
        document.getElementById('logsModal').classList.add('open');
        document.getElementById('logsModal').setAttribute('aria-hidden', 'false');
      }

      closeLogsPopup() {
        document.getElementById('logsModal').classList.remove('open');
        document.getElementById('logsModal').setAttribute('aria-hidden', 'true');
      }

      syncConfigInputs() {
        const normalized = this.normalizeDateInput(this.activeConfigDate || this.currentDate, true) || this.currentDate;
        this.activeConfigDate = normalized;
        document.getElementById('configDateInput').value = normalized;
        this.syncConfigState();
      }

      syncConfigState() {
        const day = this.getDayData(this.activeConfigDate || this.currentDate);
        const taskCount = day.tasks.length;
        const prettyDate = this.toDisplayDate(this.activeConfigDate || this.currentDate);
        const activeDateLabel = document.getElementById('activeDateLabel');
        const activeDateDetail = document.getElementById('activeDateDetail');
        const activeDateCount = document.getElementById('activeDateCount');
        const backgroundPreviewLabel = document.getElementById('backgroundPreviewLabel');
        const backgroundPresetInput = document.getElementById('backgroundPresetInput');
        const backgroundBarCountInput = document.getElementById('backgroundBarCountInput');

        if (activeDateLabel) {
          activeDateLabel.textContent = `Active date ${prettyDate}`;
        }

        if (activeDateDetail) {
          activeDateDetail.textContent = taskCount
            ? `${taskCount} task${taskCount === 1 ? '' : 's'} already planned for this date.`
            : 'No tasks are saved for this date yet.';
        }

        if (activeDateCount) {
          activeDateCount.textContent = `${taskCount} task${taskCount === 1 ? '' : 's'}`;
          activeDateCount.classList.toggle('is-hot', taskCount > 0);
          activeDateCount.classList.toggle('is-muted', taskCount === 0);
        }

        if (backgroundPreviewLabel) {
          backgroundPreviewLabel.textContent = this.getBackgroundLabel(day.backgroundPreset, day.backgroundBarCount);
          backgroundPreviewLabel.classList.toggle('is-hot', day.backgroundPreset !== 'none');
          backgroundPreviewLabel.classList.toggle('is-muted', day.backgroundPreset === 'none');
        }

        if (backgroundPresetInput) {
          backgroundPresetInput.value = day.backgroundPreset || 'none';
        }

        if (backgroundBarCountInput) {
          backgroundBarCountInput.value = this.getBackgroundBarCount(day);
          backgroundBarCountInput.disabled = (day.backgroundPreset || 'none') !== 'lines';
        }
      }

      getBackgroundLabel(preset, count = null) {
        if (preset === 'grid') return 'thin grid';
        if (preset === 'lines') return `vertical bars${count ? ` (${count})` : ''}`;
        return 'none';
      }

      getBackgroundBarCount(day) {
        const min = 2;
        const max = 20;
        const fallback = Number(DEFAULT_GAME_CONFIG?.plannerBackgroundBarCountDefault) || 8;
        const raw = Number(day?.backgroundBarCount);
        return Math.max(min, Math.min(max, Number.isFinite(raw) ? raw : fallback));
      }

      applyDateSelection(nextDate, { requireConfirm = false } = {}) {
        const normalized = this.normalizeDateInput(nextDate, true);
        if (!normalized) return false;

        const day = this.getDayData(normalized);
        if (requireConfirm && day.tasks.length > 0 && normalized !== this.activeConfigDate) {
          const confirmed = window.confirm(`Switch to ${this.toDisplayDate(normalized)}? This date already has ${day.tasks.length} task${day.tasks.length === 1 ? '' : 's'}.`);
          if (!confirmed) {
            this.syncConfigInputs();
            return false;
          }
        }

        this.activeConfigDate = normalized;
        this.currentDate = normalized;
        this.syncConfigInputs();
        this.updateDisplay();
        this.renderTasks();
        this.renderConfigTasks();
        return true;
      }

      applyBackgroundPreset(preset) {
        const day = this.getDayData(this.activeConfigDate || this.currentDate);
        day.backgroundPreset = ['none', 'grid', 'lines'].includes(preset) ? preset : 'none';
        if (!day.backgroundBarCount) {
          day.backgroundBarCount = Number(DEFAULT_GAME_CONFIG?.plannerBackgroundBarCountDefault) || 8;
        }
        this.saveData();
        this.syncConfigState();
        this.renderTasks();
      }

      applyBackgroundBarCount(value) {
        const day = this.getDayData(this.activeConfigDate || this.currentDate);
        const min = Number(DEFAULT_GAME_CONFIG?.plannerBackgroundBarCountMin) || 2;
        const max = Number(DEFAULT_GAME_CONFIG?.plannerBackgroundBarCountMax) || 20;
        const count = Math.max(min, Math.min(max, Number(value) || min));
        day.backgroundBarCount = count;
        this.saveData();
        this.syncConfigState();
        this.renderTasks();
      }

      getDayData(date) {
        if (!this.data[date]) {
          this.data[date] = {
            tasks: [],
            pendingRewards: { diamonds: 0, gold: 0 },
            notes: [],
            backgroundPreset: 'none',
            backgroundBarCount: Number(DEFAULT_GAME_CONFIG?.plannerBackgroundBarCountDefault) || 8
          };
        }

        if (!Array.isArray(this.data[date].tasks)) {
          this.data[date].tasks = [];
        }

        if (!this.data[date].pendingRewards) {
          this.data[date].pendingRewards = { diamonds: 0, gold: 0 };
        }

        if (!Array.isArray(this.data[date].notes)) {
          this.data[date].notes = [];
        }

        if (!this.data[date].backgroundPreset) {
          this.data[date].backgroundPreset = 'none';
        }

        if (typeof this.data[date].backgroundBarCount !== 'number') {
          this.data[date].backgroundBarCount = Number(DEFAULT_GAME_CONFIG?.plannerBackgroundBarCountDefault) || 8;
        }

        return this.data[date];
      }

      normalizeDateInput(value, allowIso = false) {
        if (!value) return null;
        if (allowIso && /^\d{4}-\d{2}-\d{2}$/.test(value)) return value;
        const parts = value.split(/[\/-]/).map(part => part.trim());
        if (parts.length !== 3) return null;

        let day;
        let month;
        let year;

        if (parts[0].length === 4) {
          year = Number(parts[0]);
          month = Number(parts[1]);
          day = Number(parts[2]);
        } else {
          day = Number(parts[0]);
          month = Number(parts[1]);
          year = Number(parts[2]);
          if (year < 100) {
            year += 2000;
          }
        }

        const parsed = new Date(year, month - 1, day);
        if (Number.isNaN(parsed.getTime())) return null;
        if (parsed.getFullYear() !== year || parsed.getMonth() !== month - 1 || parsed.getDate() !== day) return null;
        return `${String(year).padStart(4, '0')}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
      }

      toDisplayDate(dateString) {
        const [year, month, day] = dateString.split('-').map(Number);
        return `${String(day).padStart(2, '0')}/${String(month).padStart(2, '0')}/${year}`;
      }

      parseDateHeader(line) {
        return this.normalizeDateInput(line, false) || this.normalizeDateInput(line, true);
      }

      parseQuickAddRaw(raw) {
        const lines = (raw || '').split(/\r?\n/).map(line => line.trim());
        const stagedAdds = [];
        let currentDate = null;

        for (const line of lines) {
          if (!line) continue;
          const parsedDate = this.parseDateHeader(line);
          if (parsedDate) {
            currentDate = parsedDate;
            if (!stagedAdds.some(entry => entry.date === currentDate)) {
              stagedAdds.push({ date: currentDate, tasks: [] });
            }
            continue;
          }

          const taskMatch = line.match(/^([EMHU])\s*-\s*(STR|INT|DISC|CREA|SOC|CAP|RESP)\s*-\s*(.+?);?$/i);
          if (!taskMatch || !currentDate) {
            throw new Error('Quick add format error. Use: DD/MM/YYYY then E - STR - task name;');
          }

          const difficultyMap = { E: 'Easy', M: 'Medium', H: 'Hard', U: 'Ultra' };
          const dateBucket = stagedAdds.find(entry => entry.date === currentDate);
          dateBucket.tasks.push({
            id: `${Date.now()}-${Math.random().toString(16).slice(2)}`,
            name: taskMatch[3].trim(),
            difficulty: difficultyMap[taskMatch[1].toUpperCase()],
            attribute: taskMatch[2].toUpperCase(),
            completed: false,
            x: null,
            y: null
          });
        }

        return stagedAdds;
      }

      exportQuickAddFromTasks() {
        const dates = Object.keys(this.data || {})
          .filter(k => /^\d{4}-\d{2}-\d{2}$/.test(k))
          .sort();

        const diffToShort = { Easy: 'E', Medium: 'M', Hard: 'H', Ultra: 'U' };
        const lines = [];
        dates.forEach((date, dateIndex) => {
          const day = this.getDayData(date);
          if (!day.tasks.length) return;
          if (dateIndex > 0 && lines.length) lines.push('');
          lines.push(this.toDisplayDate(date));
          day.tasks.forEach(task => {
            lines.push(`${diffToShort[task.difficulty] || 'E'} - ${task.attribute} - ${task.name};`);
          });
        });
        return lines.join('\n');
      }

      seedTaskPosition(task, stageWidth, stageHeight) {
        const nameSeed = task.name.split('').reduce((sum, char) => sum + char.charCodeAt(0), 0);
        const difficultySeed = plannerDifficultyOrder.indexOf(task.difficulty) + 1;
        const xRange = Math.max(stageWidth - 100, 20);
        const yRange = Math.max(stageHeight - 100, 20);
        return {
          x: (nameSeed * 37 + difficultySeed * 71) % xRange,
          y: (nameSeed * 53 + difficultySeed * 29) % yRange
        };
      }

      shapeClassForDifficulty(difficulty) {
        const normalized = String(difficulty || '').toLowerCase();
        if (normalized === 'easy') return 'easy';
        if (normalized === 'medium') return 'medium';
        if (normalized === 'hard') return 'hard';
        return 'ultra';
      }

      addTaskFromForm() {
        this.setConfigError('');
        const date = this.normalizeDateInput(document.getElementById('configDateInput').value, true);
        const name = document.getElementById('configTaskNameInput').value.trim();
        const difficulty = document.getElementById('configDifficultyInput').value;
        const attribute = document.getElementById('configAttributeInput').value;

        if (!date) {
          this.setConfigError('Choose a valid date before adding a task.');
          return;
        }

        if (!name) {
          this.setConfigError('Task name is required.');
          return;
        }

        if (!plannerDifficultyOrder.includes(difficulty)) {
          this.setConfigError('Choose a valid difficulty.');
          return;
        }

        if (!plannerAttributeOptions.includes(attribute)) {
          this.setConfigError('Choose a valid attribute.');
          return;
        }

        const day = this.getDayData(date);
        const task = {
          id: `${Date.now()}-${Math.random().toString(16).slice(2)}`,
          name,
          difficulty,
          attribute,
          completed: false,
          x: null,
          y: null
        };

        const seeded = this.seedTaskPosition(task, document.getElementById('plannerStage').clientWidth || 320, document.getElementById('plannerStage').clientHeight || 400);
        task.x = seeded.x;
        task.y = seeded.y;
        day.tasks.push(task);

        this.currentDate = date;
        this.activeConfigDate = date;
        this.saveData();
        this.updateDisplay();
        this.syncConfigInputs();
        this.renderTasks();
        this.renderConfigTasks();
        document.getElementById('configTaskNameInput').value = '';
      }

      applyQuickAdd() {
        this.setConfigError('');
        const raw = document.getElementById('quickAddInput').value.trim();
        if (!raw) {
          this.setConfigError('Paste at least one date block into quick add.');
          return;
        }

        let stagedAdds = [];
        try {
          stagedAdds = this.parseQuickAddRaw(raw);
        } catch (err) {
          this.setConfigError(err.message || 'Quick add format error.');
          return;
        }

        if (!stagedAdds.length) {
          this.setConfigError('No valid quick-add blocks were found.');
          return;
        }

        const stageWidth = document.getElementById('plannerStage').clientWidth || 320;
        const stageHeight = document.getElementById('plannerStage').clientHeight || 400;

        stagedAdds.forEach(entry => {
          const day = this.getDayData(entry.date);
          entry.tasks.forEach(task => {
            const seeded = this.seedTaskPosition(task, stageWidth, stageHeight);
            task.x = seeded.x;
            task.y = seeded.y;
            day.tasks.push(task);
          });
        });

        this.currentDate = stagedAdds[0].date;
        this.activeConfigDate = this.currentDate;
        this.saveData();
        this.updateDisplay();
        this.syncConfigInputs();
        this.renderTasks();
        this.renderConfigTasks();
        document.getElementById('quickAddInput').value = '';
      }

      moveTasksToDate(fromDateInput, toDateInput, mode = 'all') {
        this.setConfigError('');
        const fromDate = this.normalizeDateInput(fromDateInput, true);
        const toDate = this.normalizeDateInput(toDateInput, true);
        if (!fromDate || !toDate) {
          this.setConfigError('Choose valid source and destination dates.');
          return;
        }
        if (fromDate === toDate) {
          this.setConfigError('Source and destination dates must differ.');
          return;
        }

        const fromDay = this.getDayData(fromDate);
        const toDay = this.getDayData(toDate);
        let moving = [];
        if (mode === 'completed') moving = fromDay.tasks.filter(t => t.completed);
        else if (mode === 'incomplete') moving = fromDay.tasks.filter(t => !t.completed);
        else moving = fromDay.tasks.slice();

        if (!moving.length) {
          this.setConfigError('No tasks matched the selected move mode.');
          return;
        }

        const movedIds = new Set(moving.map(t => t.id));
        fromDay.tasks = fromDay.tasks.filter(t => !movedIds.has(t.id));
        moving.forEach(task => {
          const movedTask = { ...task, x: null, y: null };
          toDay.tasks.push(movedTask);
        });

        this.currentDate = toDate;
        this.activeConfigDate = toDate;
        document.getElementById('moveToDateInput').value = toDate;
        this.saveData();
        this.updateDisplay();
        this.syncConfigInputs();
        this.renderTasks();
        this.renderConfigTasks();
      }

      refreshLogsFromTasks() {
        this.setLogsError('');
        const raw = this.exportQuickAddFromTasks();
        document.getElementById('plannerLogsInput').value = raw;
      }

      saveLogsText() {
        this.setLogsError('');
        if (!this.data._meta) this.data._meta = { logsRaw: '' };
        this.data._meta.logsRaw = document.getElementById('plannerLogsInput').value || '';
        this.saveData();
      }

      applyLogsToTasks() {
        this.setLogsError('');
        const raw = document.getElementById('plannerLogsInput').value || '';
        let stagedAdds = [];
        try {
          stagedAdds = this.parseQuickAddRaw(raw);
        } catch (err) {
          this.setLogsError(err.message || 'Unable to parse logs text.');
          return;
        }

        if (!stagedAdds.length) {
          this.setLogsError('No valid date/task blocks found.');
          return;
        }

        // Replace tasks for dates present in logs text.
        const stageWidth = document.getElementById('plannerStage').clientWidth || 320;
        const stageHeight = document.getElementById('plannerStage').clientHeight || 400;
        stagedAdds.forEach(entry => {
          const day = this.getDayData(entry.date);
          day.tasks = [];
          entry.tasks.forEach(task => {
            const seeded = this.seedTaskPosition(task, stageWidth, stageHeight);
            task.x = seeded.x;
            task.y = seeded.y;
            day.tasks.push(task);
          });
        });

        if (!this.data._meta) this.data._meta = { logsRaw: '' };
        this.data._meta.logsRaw = raw;
        this.currentDate = stagedAdds[0].date;
        this.activeConfigDate = this.currentDate;
        this.saveData();
        this.updateDisplay();
        this.syncConfigInputs();
        this.renderTasks();
        this.renderConfigTasks();
      }

      renderConfigTasks() {
        const container = document.getElementById('configTaskList');
        const day = this.getDayData(this.activeConfigDate || this.currentDate);
        container.innerHTML = '';

        if (!day.tasks.length) {
          const empty = document.createElement('div');
          empty.className = 'planner-empty';
          empty.textContent = 'No tasks saved for this date yet.';
          container.appendChild(empty);
          return;
        }

        day.tasks.forEach(task => {
          const row = document.createElement('div');
          row.className = 'planner-task-row';
          const meta = document.createElement('div');
          meta.className = 'planner-task-meta';
          meta.innerHTML = `<strong>${task.completed ? '✅ ' : ''}${task.name}</strong><span>${task.difficulty} · ${task.attribute}</span>`;
          const removeBtn = document.createElement('button');
          removeBtn.className = 'btn-icon';
          removeBtn.textContent = 'Delete';
          removeBtn.addEventListener('click', () => {
            const targetDay = this.getDayData(this.activeConfigDate || this.currentDate);
            targetDay.tasks = targetDay.tasks.filter(entry => entry.id !== task.id);
            this.saveData();
            this.updateDisplay();
            this.renderTasks();
            this.renderConfigTasks();
          });
          row.appendChild(meta);
          row.appendChild(removeBtn);
          container.appendChild(row);
        });

        container.classList.toggle('has-scroll', day.tasks.length > 4);
        this.syncConfigState();
      }

      setConfigError(message) {
        document.getElementById('configError').textContent = message;
      }

      setLogsError(message) {
        document.getElementById('logsError').textContent = message;
      }

      addNote() {
        const note = document.createElement('div');
        note.className = 'sticky-note';
        note.style.left = Math.random() * (window.innerWidth - 150) + 'px';
        note.style.top = Math.random() * (window.innerHeight - 150) + 'px';
        note.innerHTML = `
          <div class="note-toolbar">
            <button class="note-btn">🎨</button>
            <button class="note-btn">✕</button>
          </div>
          <div contenteditable="true">New note...</div>
        `;
        document.body.appendChild(note);

        let isDragging = false;
        let offsetX, offsetY;

        note.addEventListener('mousedown', (e) => {
          if (e.target.classList.contains('note-btn')) return;
          isDragging = true;
          offsetX = e.clientX - note.offsetLeft;
          offsetY = e.clientY - note.offsetTop;
          note.classList.add('dragging');
        });

        document.addEventListener('mousemove', (e) => {
          if (isDragging) {
            note.style.left = (e.clientX - offsetX) + 'px';
            note.style.top = (e.clientY - offsetY) + 'px';
          }
        });

        document.addEventListener('mouseup', () => {
          isDragging = false;
          note.classList.remove('dragging');
        });

        note.querySelector('button:nth-child(2)').addEventListener('click', () => {
          note.remove();
        });
      }
    }

    // Initialize planner app
    const planner = new PlannerApp();

    // Listen to main game storage changes
    window.addEventListener('storage', (e) => {
      if (e.key === plannerKey) {
        planner.data = JSON.parse(e.newValue || '{}') || {};
        if (!planner.data._meta) planner.data._meta = { logsRaw: '' };
        planner.updateDisplay();
        planner.syncConfigState();
        planner.renderTasks();
        planner.renderConfigTasks();
      }
    });
  </script>
</body>
</html>
